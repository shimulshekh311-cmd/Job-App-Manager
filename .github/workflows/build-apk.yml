name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION"
          JAVA_MAJOR=$(echo "$JAVA_VERSION" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or newer. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified: Version $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk/ for discovered APKs:"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::APK file $TARGET_APK exists but is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "::error::$TARGET_APK does not have .apk extension"; exit 1 ;;
          esac

          echo "APK successfully verified at: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_ASSET_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_ASSET_DIR/app-debug.apk"
          if [ ! -f "$TMP_ASSET_DIR/app-debug.apk" ]; then
            echo "::error::Failed to copy APK to temporary release directory."
            exit 1
          fi
          echo "apk_path=$TMP_ASSET_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TMP_ASSET_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi

          APK_FILE="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ ! -f "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Prepared release APK does not exist or is empty: $APK_FILE"
            exit 1
          fi

          case "$APK_FILE" in
            *.apk) ;;
            *) echo "::error::$APK_FILE is not an .apk file"; exit 1 ;;
          esac

          ASSET_NAME=$(basename "$APK_FILE")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk, got: $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### 📱 Debug APK Build Details

          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Usage:** Intended strictly for testing and verification
          - **Note:** This APK is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          echo "Creating release $RELEASE_TAG for commit ${{ github.sha }}..."
          gh release create "$RELEASE_TAG" "$APK_FILE" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "=== Release Created Successfully ==="
            gh release view "$RELEASE_TAG" || true

            DIRECT_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

            echo ""
            echo "DIRECT APK DOWNLOAD URL:"
            echo "$DIRECT_DOWNLOAD_URL"
            echo "Backup Actions artifact 'app-debug-apk' remains available."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "Download the latest debug APK directly:"
              echo ""
              echo "[Download app-debug.apk]($DIRECT_DOWNLOAD_URL)"
              echo ""
              echo "\`\`\`"
              echo "$DIRECT_DOWNLOAD_URL"
              echo "\`\`\`"
              echo ""
              echo "> **Note:** Backup Actions artifact \`app-debug-apk\` is also available from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publication did not complete successfully or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was successfully built."
              echo "The Actions artifact 'app-debug-apk' remains available for download from the Summary page."
            fi
            {
              echo "## APK Build Status"
              echo ""
              echo "The debug APK was built and uploaded as the Actions artifact \`app-debug-apk\`."
              echo "GitHub Release publishing did not complete."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
